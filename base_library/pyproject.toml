[project]
name = "extension-base"
version = "0.1.0"
description = "Extension Base Library for Instana Custom Collector Framework"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [
    { name = "Paulo Vital", email = "paulo.vital@ibm.com" },
    { name = "Varsha GS", email = "varsha.gs@ibm.com" },
]
maintainers = [
    { name = "Instana Python Tracer Engineers", email = "pythonrubyinstana@ibm.com" },
]
dependencies = [
    "pydantic==2.13.4",
    "opentelemetry-api==1.42.1",
    "opentelemetry-sdk==1.42.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.42.1",
    "opentelemetry-exporter-otlp-proto-http==1.42.1",
    "psutil==7.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "tomli>=2.0.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=extension_base",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
    "-v",
    "--strict-markers",
]
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests for component interactions",
    "slow: Tests that take longer to execute",
]

[tool.coverage.run]
source = ["extension_base"]
omit = ["*/tests/*", "*/test_*.py", "*/__pycache__/*"]
branch = true

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
line-length = 79
target-version = "py312"
select = [
    "E",        # pycodestyle
    "F",        # Pyflakes
    "I",        # isort
    "CPY",      # flake8-copyright
    "SIM",      # flake8-simplify
    "FLY",      # flynt (static-join-to-f-string)
    "UP031",    # printf-string-formatting
    "UP032",    # f-string
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "I001",  # single line imports allowed in tests
]

[tool.ruff.lint.flake8-copyright]
notice-rgx = "(?i)#\\s?(\\(c\\)\\s+)?Copyright\\s+IBM Corp\\.\\s+(\\d{4}((-|,\\s)\\d{4})?)"
min-file-size = 1024

[tool.ruff.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # assert allowed in tests
    "PLR2004",  # magic values allowed in tests
]

[tool.ruff.isort]
known-first-party = ["extension_base"]

[project.urls]
Homepage = "https://www.ibm.com/products/instana/opentelemetry"
GitHub = "https://github.com/instana/collector-extension-framework"
Issues = "https://github.com/instana/collector-extension-framework/issues"
